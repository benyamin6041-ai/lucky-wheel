<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a2e; color: white; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .page { width: 100%; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; position: absolute; }
        .active { display: flex !important; }
        #wheel-container { position: relative; width: 300px; height: 300px; }
        #wheel { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        button { padding: 15px 50px; margin-top: 30px; border-radius: 15px; border: none; background: #ff416c; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-link { padding: 15px 40px; margin-top: 20px; border-radius: 15px; background: #00b09b; color: white; text-decoration: none; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- صفحه ۱: گردونه -->
    <div id="page1" class="page active">
        <div id="wheel-container">
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>
        <button onclick="spin()">چرخاندن گردونه</button>
    </div>

    <!-- صفحه ۲: نتیجه -->
    <div id="page2" class="page">
        <h1>تبریک! برنده شدید</h1>
        <div id="result" style="font-size: 24px; color: #ffeb3b; margin: 20px;"></div>
        <a id="prize-link" href="#" target="_blank" class="btn-link">دریافت جایزه</a>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const prizes = ["شارژ ۱۰", "اینترنت ۲", "شارژ ۲۰", "اینترنت ۵"];
        const colors = ["#FF5733", "#33FF57", "#3357FF", "#F333FF"];
        const sector = (2 * Math.PI) / prizes.length;

        // رسم گردونه
        prizes.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(150, 150);
            ctx.arc(150, 150, 150, i * sector, (i + 1) * sector);
            ctx.fill();
        });

        let rot = 0;
        function spin() {
            rot += 3000 + Math.random() * 1000;
            canvas.style.transform = `rotate(${rot}deg)`;
            setTimeout(() => {
                document.getElementById('page1').classList.remove('active');
                document.getElementById('page2').classList.add('active');
                document.getElementById('result').innerText = "جایزه شما آماده است!";
                document.getElementById('prize-link').href = "https://script.google.com/macros/s/AKfycbwcvt_--jOR_soR5guN84DL7I6gLNwvRUhgvT0nRdm1M6eTCQBKmAEylv8V-gsXNwgMzQ/exec";
            }, 4200);
        }
    </script>
</body>
</html>
